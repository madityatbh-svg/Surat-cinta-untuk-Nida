<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Ucapan Romantis & Surat Cinta</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Poppins & Dancing Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            pink: { primary: '#ec4899', secondary: '#f472b6', bg: '#fdf2f8', card: '#ffffff', text: '#831843' },
                            rosegold: { primary: '#e11d48', secondary: '#fb7185', bg: '#fff1f2', card: '#ffffff', text: '#881337' },
                            purple: { primary: '#a855f7', secondary: '#c084fc', bg: '#faf5ff', card: '#ffffff', text: '#581c87' },
                            pastel: { primary: '#f43f5e', secondary: '#fda4af', bg: '#fff5f5', card: '#ffffff', text: '#9f1239' }
                        }
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        handwriting: ['Dancing Script', 'cursive'],
                        script: ['Sacramento', 'cursive']
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Smooth Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.4);
            border-radius: 10px;
        }

        /* Floating Hearts Animation Background */
        .heart-particle {
            position: fixed;
            bottom: -20px;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
            z-index: 10;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(-115vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Interactive Envelope Animation */
        .envelope-wrapper {
            position: relative;
            perspective: 1000px;
        }

        .envelope {
            width: 320px;
            height: 220px;
            position: relative;
            background-color: #f472b6;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .envelope:hover {
            transform: translateY(-5deg);
        }

        .envelope .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 115px solid #ec4899;
            transform-origin: top;
            transition: transform 0.5s ease 0.2s, z-index 0.2s;
            z-index: 4;
        }

        .envelope .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #fbcfe8;
            border-right: 160px solid #fbcfe8;
            border-bottom: 110px solid #f472b6;
            border-top: 110px solid transparent;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 3;
        }

        .envelope .letter {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 290px;
            height: 190px;
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.5s ease 0.4s, opacity 0.5s ease;
            z-index: 2;
            overflow: hidden;
        }

        .envelope.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope.open .letter {
            transform: translateY(-130px);
            z-index: 5;
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Pulse Heart Seal */
        .heart-seal {
            animation: pulseGlow 1.8s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); }
            50% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 20px 8px rgba(236, 72, 153, 0.2); }
        }
    </style>
</head>
<body id="app-body" class="bg-rose-50 font-poppins min-h-screen text-slate-800 transition-colors duration-500 relative overflow-x-hidden">

    <!-- Floating Background Hearts Container -->
    <div id="hearts-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 right-5 transform translate-y-[-100px] opacity-0 transition-all duration-300 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3">
        <i id="toast-icon" class="fa-solid fa-circle-check text-pink-400"></i>
        <span id="toast-message" class="text-sm font-medium">Pesan berhasil disalin!</span>
    </div>

    <!-- Main Container -->
    <div class="relative z-10 max-w-6xl mx-auto px-4 py-8 md:py-12">
        
        <!-- Header Title -->
        <header class="text-center mb-8 md:mb-12">
            <span class="bg-pink-100 text-pink-600 text-xs font-semibold px-4 py-1.5 rounded-full uppercase tracking-widest shadow-sm inline-block mb-3">
                <i class="fa-solid fa-heart mr-1.5 text-pink-500"></i> Generator Kartu Bucin
            </span>
            <h1 class="text-3xl md:text-5xl font-bold text-slate-900 tracking-tight">
                Ungkapkan Perasaanmu dengan <span id="header-accent" class="text-pink-500 font-handwriting text-4xl md:text-6xl">Indah & Manis</span>
            </h1>
            <p class="text-slate-500 text-sm md:text-base mt-2 max-w-xl mx-auto">
                Kustomisasi pesan romantis untuk pacar/pasanganmu, buka amplop interaktifnya, lalu bagikan atau simpan momen manismu!
            </p>
        </header>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- LEFT PANEL: EDITOR FORM (5 Cols) -->
            <div class="lg:col-span-5 glass-card rounded-3xl p-6 md:p-8 shadow-xl border border-white/60">
                <div class="flex items-center justify-between mb-6 pb-3 border-b border-slate-100">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center">
                        <i class="fa-solid fa-pen-nib text-pink-500 mr-2.5"></i> Panel Editor
                    </h2>
                    <span class="text-xs bg-slate-100 text-slate-500 px-2.5 py-1 rounded-md">Live Edit</span>
                </div>

                <form id="card-form" class="space-y-5" onsubmit="event.preventDefault();">
                    
                    <!-- Input Untuk Siapa -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
                            Untuk Siapa (Panggilan Kesayangan)
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-user-heart"></i>
                            </span>
                            <input type="text" id="input-to" value="Pacarku Nida Tersayang ❤️" placeholder="Contoh: Princess / Sayang / Nama Pacar"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none transition text-sm">
                        </div>
                    </div>

                    <!-- Input Dari Siapa -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
                            Dari Siapa
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-paper-plane"></i>
                            </span>
                            <input type="text" id="input-from" value="Orang yang paling kamu sayang" placeholder="Contoh: Pacar Tampanmu"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none transition text-sm">
                        </div>
                    </div>

                    <!-- Preset Message Selection -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
                            Pilih Preset Teks Bucin
                        </label>
                        <div class="grid grid-cols-3 gap-2">
                            <button type="button" onclick="applyPreset('romantic')" class="preset-btn py-2 px-3 bg-pink-50 hover:bg-pink-100 text-pink-700 rounded-xl text-xs font-medium transition border border-pink-200 flex flex-col items-center justify-center space-y-1">
                                <i class="fa-solid fa-heart-pulse text-base"></i>
                                <span>Romantis</span>
                            </button>
                            <button type="button" onclick="applyPreset('cute')" class="preset-btn py-2 px-3 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-xl text-xs font-medium transition border border-purple-200 flex flex-col items-center justify-center space-y-1">
                                <i class="fa-solid fa-face-smile-wink text-base"></i>
                                <span>Lucu & Gemes</span>
                            </button>
                            <button type="button" onclick="applyPreset('sweet')" class="preset-btn py-2 px-3 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-xl text-xs
